<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Anime İzle</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:#0a0a14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
  .header{position:sticky;top:0;z-index:100;padding:10px 16px;background:rgba(26,26,46,0.95);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #222}
  .header h1{font-size:15px;color:#667eea;font-weight:700}
  .badge{padding:4px 12px;border-radius:12px;font-size:11px;font-weight:700}
  .badge.admin{background:#f39c12;color:#000;box-shadow:0 0 12px rgba(243,156,18,0.5)}
  .badge.viewer{background:#333;color:#ccc}
  .badge.connecting{background:#555;color:#fff;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
  .video-wrap{position:relative;width:100%;background:#000;aspect-ratio:16/9;max-height:60vh}
  .video-wrap video{width:100%;height:100%;display:block;background:#000}
  .video-wrap video::cue{background:rgba(0,0,0,0.75);color:#fff;font-size:18px;font-weight:600}
  .video-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#ccc;font-size:14px;text-align:center;padding:24px;z-index:5}
  .video-overlay.hidden{display:none}
  .video-overlay .msg{line-height:1.5;max-width:400px}
  .spinner{width:32px;height:32px;border:3px solid rgba(102,126,234,0.2);border-top-color:#667eea;border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .status-bar{padding:7px 14px;background:#12121f;font-size:11px;color:#888;display:flex;justify-content:space-between;border-bottom:1px solid #222;align-items:center;gap:8px;flex-wrap:wrap}
  .status-bar .live{color:#e74c3c;font-weight:700;display:flex;align-items:center;gap:6px}
  .status-bar .live::before{content:"";width:7px;height:7px;background:#e74c3c;border-radius:50%;animation:pulse 1.5s infinite}
  .sub-status{display:flex;align-items:center;gap:6px;font-size:10px;padding:3px 9px;border-radius:10px;background:#222}
  .sub-status.ok{background:rgba(39,174,96,0.2);color:#27ae60}
  .sub-status.loading{background:rgba(243,156,18,0.2);color:#f39c12}
  .sub-status.none{background:#222;color:#666}
  .admin-panel{display:none;padding:12px;max-width:1200px;margin:0 auto}
  .admin-panel.show{display:block}
  .section-title{font-size:12px;color:#667eea;font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
  .search-box{display:flex;gap:6px;margin-bottom:12px}
  .search-box input{flex:1;padding:10px 14px;border:2px solid #333;border-radius:10px;background:#1a1a2e;color:#fff;font-size:14px;outline:none;transition:border-color 0.2s}
  .search-box input:focus{border-color:#667eea}
  .search-box button{padding:10px 20px;background:#667eea;color:#fff;border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
  .search-box button:disabled{background:#333;cursor:not-allowed}
  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-bottom:12px}
  .result{background:#1a1a2e;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform 0.15s,border-color 0.15s;border:2px solid transparent;position:relative}
  .result:hover{transform:translateY(-2px);border-color:#667eea}
  .result.selected{border-color:#27ae60}
  .result.disabled{opacity:0.5;cursor:wait;pointer-events:none}
  .result img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#333}
  .result-title{padding:5px;font-size:10px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .result-meta{padding:0 5px 5px;font-size:9px;color:#666}
  .controls{display:flex;gap:8px;padding:10px;background:#1a1a2e;border-radius:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .controls label{font-size:11px;color:#888}
  .controls input,.controls select{padding:7px 10px;background:#0a0a14;color:#fff;border:1px solid #333;border-radius:6px;font-size:13px;text-align:center}
  .controls input{width:65px}
  .controls .info{flex:1;min-width:0;font-size:12px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .controls .sub-badge{padding:3px 9px;border-radius:10px;font-size:10px;font-weight:600}
  .controls .sub-badge.yes{background:rgba(39,174,96,0.2);color:#27ae60}
  .controls .sub-badge.no{background:#333;color:#888}
  .viewer-info{padding:20px;text-align:center;color:#666;font-size:12px;max-width:600px;margin:0 auto}
  .viewer-info .big{font-size:42px;margin-bottom:12px;opacity:0.5}
  .log{max-width:1200px;margin:0 auto;padding:0 12px 20px}
  .log .line{padding:3px 0;font-size:10px;color:#555;font-family:'Courier New',monospace}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2d2d44;padding:10px 18px;border-radius:10px;font-size:12px;z-index:1000;animation:slideUp 0.3s;box-shadow:0 4px 20px rgba(0,0,0,0.5);max-width:90%}
  @keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>

<div class="header">
  <h1>🎬 Anime İzle</h1>
  <span id="badge" class="badge connecting">Bağlanıyor...</span>
</div>

<div class="video-wrap">
  <video id="video" playsinline preload="metadata"></video>
  <div id="overlay" class="video-overlay">
    <div class="spinner"></div>
    <div class="msg" id="overlayMsg">Bağlanılıyor...</div>
  </div>
</div>

<div class="status-bar">
  <span id="statusText">Bekleniyor</span>
  <div style="display:flex;gap:6px;align-items:center">
    <span id="subStatus" class="sub-status none">Altyazı yok</span>
    <span id="liveBadge" class="live" style="display:none">CANLI</span>
  </div>
</div>

<div id="adminPanel" class="admin-panel">
  <div class="section-title">Anime Ara</div>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Anime adı yaz..." autocomplete="off">
    <button id="searchBtn" onclick="doSearch()">Ara</button>
  </div>
  <div id="results" class="results"></div>

  <div class="section-title">Bölüm ve Mod</div>
  <label>Altyazı Kaydır:</label>
<button onclick="shiftSubtitle(-1)" style="padding:5px 10px;background:#e74c3c;border:none;border-radius:5px;color:#fff;cursor:pointer;font-weight:700">-1s</button>
<button onclick="shiftSubtitle(1)" style="padding:5px 10px;background:#27ae60;border:none;border-radius:5px;color:#fff;cursor:pointer;font-weight:700">+1s</button>
<span id="subOffsetLabel" style="font-size:11px;color:#888">0s</span>
    <input type="number" id="seasonInput" value="1" min="1" max="20" onchange="onEpChange()">
    <label>Bölüm:</label>
    <input type="number" id="epInput" value="1" min="1" max="9999" onchange="onEpChange()">
    <label>Mod:</label>
    <select id="modeSelect" onchange="onModeChange()">
      <option value="sub">Altyazılı</option>
      <option value="dub">Dublaj</option>
    </select>
    <span class="info" id="selectedName">Anime seçilmedi</span>
    <span class="sub-badge no" id="subBadge">Altyazı yok</span>
  </div>

  <div class="section-title">Kayıt</div>
  <div id="logBox" class="log"></div>
</div>

<div id="viewerInfo" class="viewer-info" style="display:none">
  <div class="big">📺</div>
  <div>Yönetici bir video başlattığında otomatik olarak görünecek.</div>
  <div style="margin-top:8px;font-size:11px;color:#444">Türkçe altyazı otomatik hazırlanır.</div>
</div>

<script>
const deviceId = (function () {
  let id = localStorage.getItem("deviceId");
  if (!id) {
    id = "dev_" + Date.now().toString(36) + "_" + Math.random().toString(36).substring(2, 10);
    localStorage.setItem("deviceId", id);
  }
  return id;
})();

const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const badge = document.getElementById("badge");
const adminPanel = document.getElementById("adminPanel");
const viewerInfo = document.getElementById("viewerInfo");
const statusText = document.getElementById("statusText");
const subStatus = document.getElementById("subStatus");
const liveBadge = document.getElementById("liveBadge");
const resultsBox = document.getElementById("results");
const epInput = document.getElementById("epInput");
const seasonInput = document.getElementById("seasonInput");
const modeSelect = document.getElementById("modeSelect");
const selectedName = document.getElementById("selectedName");
const subBadge = document.getElementById("subBadge");
const logBox = document.getElementById("logBox");

let socket = null;
let isAdmin = false;
let currentAnime = null;
let currentVideoKey = null;
let hls = null;
let syncing = false;
let hasVideo = false;
let isLoading = false;
let trTrack = null;
let subtitlePollInterval = null;
let lastKnownTime = 0;
let lastKnownKey = null;
let restoringPosition = false;
let subtitleOffset = 0;
const subtitleOffsetStore = {
  get: (key) => {
    try { return parseFloat(localStorage.getItem("subOffset_" + key) || "0"); } catch (e) { return 0; }
  },
  set: (key, val) => {
    try { localStorage.setItem("subOffset_" + key, String(val)); } catch (e) {}
  }
};
function log(msg) {
  const line = document.createElement("div");
  line.className = "line";
  const t = new Date().toLocaleTimeString("tr-TR");
  line.textContent = `[${t}] ${msg}`;
  logBox.appendChild(line);
  logBox.scrollTop = logBox.scrollHeight;
  while (logBox.children.length > 60) logBox.removeChild(logBox.firstChild);
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function setOverlay(msg, showSpinner = true) {
  overlay.classList.remove("hidden");
  overlay.innerHTML = (showSpinner ? '<div class="spinner"></div>' : '') +
    '<div class="msg">' + msg + '</div>';
}

function hideOverlay() {
  overlay.classList.add("hidden");
}

function setSubStatus(state, text) {
  subStatus.className = "sub-status " + state;
  subStatus.textContent = text;
  subBadge.className = "sub-badge " + (state === "ok" ? "yes" : "no");
  subBadge.textContent = text;
}

function connectSocket() {
  log("Sunucuya bağlanılıyor...");
  socket = io({ transports: ["websocket", "polling"], reconnection: true, reconnectionAttempts: Infinity });

  socket.on("connect", () => {
    log("Bağlantı kuruldu: " + socket.id);
    socket.emit("join", { deviceId });
  });

  socket.on("disconnect", () => {
    log("Bağlantı koptu, yeniden bağlanılıyor...");
    badge.className = "badge connecting";
    badge.textContent = "Bağlanıyor...";
  });

  socket.on("you-are", (data) => {
    isAdmin = !!data.isAdmin;
    log(`Rol: ${isAdmin ? "YÖNETİCİ" : "İZLEYİCİ"}`);
    if (isAdmin) {
      badge.className = "badge admin";
      badge.textContent = "👑 YÖNETİCİ";
      adminPanel.classList.add("show");
      viewerInfo.style.display = "none";
      if (!hasVideo) setOverlay("Anime ara ve bölüm seç.<br>Seçtiğinde herkese yayınlanır.", false);
      statusText.textContent = "Yönetici modu";
    } else {
      badge.className = "badge viewer";
      badge.textContent = "👤 İZLEYİCİ";
      adminPanel.classList.remove("show");
      viewerInfo.style.display = "block";
      if (!hasVideo) setOverlay("Yönetici bekleniyor...", false);
      statusText.textContent = "İzleyici modu";
    }
  });

  socket.on("video-load", (data) => {
    log("Video: " + data.title);
    hasVideo = true;
    hideOverlay();
    liveBadge.style.display = "flex";

    const newKey = `${data.animeId}_${data.episode}_${data.mode || "sub"}`;
    const isSameVideo = currentVideoKey === newKey;
    currentVideoKey = newKey;

    if (!isSameVideo) {
      lastKnownTime = 0;
      lastKnownKey = newKey;
    }

    loadVideoSource(data.url);
    if (data.title) statusText.textContent = data.title;
    if (data.mode) modeSelect.value = data.mode;
    if (data.season) seasonInput.value = data.season;

    if (data.animeId && data.episode) {
      const animeTitle = (currentAnime && currentAnime.title) || data.title || "";
      const anime = currentAnime || {
        id: data.animeId,
        title: data.title || "",
        titleEnglish: data.title || "",
        titleRomaji: data.title || ""
      };
      startSubtitleFlow(data.animeId, data.episode, data.mode || "sub", data.season || 1, anime);
    }
  });

  socket.on("video-control", (data) => {
    if (isAdmin) return;
    applyControl(data);
  });

  socket.on("video-state", (data) => {
    if (isAdmin) return;
    if (!hasVideo) return;
    setTimeout(() => applyControl(data), 500);
  });

  socket.on("error-msg", (data) => log("Uyarı: " + data.message));
}

function loadVideoSource(rawUrl) {
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
  video.pause();
  video.removeAttribute("src");
  while (video.firstChild) video.removeChild(video.firstChild);
  video.load();

  trTrack = null;

  const proxyUrl = "/api/proxy?url=" + encodeURIComponent(rawUrl);

  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      maxBufferLength: 30,
      renderTextTracksNatively: false
    });
    hls.loadSource(proxyUrl);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      try {
        hls.subtitleDisplay = false;
        hls.subtitleTrack = -1;
      } catch (e) {}
      const vt = video.textTracks;
      for (let i = 0; i < vt.length; i++) {
        vt[i].mode = "disabled";
      }
      if (lastKnownTime > 2 && video.currentTime < 2 && lastKnownKey === currentVideoKey) {
        restoringPosition = true;
        setTimeout(() => {
          try { video.currentTime = lastKnownTime; } catch (e) {}
          setTimeout(() => { restoringPosition = false; }, 800);
        }, 400);
      }
      log("Video hazır");
    });

    hls.on(Hls.Events.ERROR, (e, d) => {
      if (d.fatal) log("Video hatası: " + d.details);
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = proxyUrl;
  }
}

function applyControl(data) {
  if (!data || !data.action) return;
  syncing = true;
  const elapsed = data.at ? (Date.now() - data.at) / 1000 : 0;
  if (data.action === "play") {
    const target = (data.currentTime || 0) + elapsed;
    if (Math.abs(video.currentTime - target) > 1.5) video.currentTime = target;
    video.play().catch(() => {});
  } else if (data.action === "pause") {
    video.pause();
    if (Math.abs(video.currentTime - (data.currentTime || 0)) > 1.5) video.currentTime = data.currentTime || 0;
  } else if (data.action === "seek") {
    video.currentTime = data.currentTime || 0;
  }
  setTimeout(() => { syncing = false; }, 400);
}

video.addEventListener("play", () => {
  if (!isAdmin || syncing || restoringPosition) return;
  socket.emit("video-control", { action: "play", currentTime: video.currentTime, at: Date.now() });
});
video.addEventListener("pause", () => {
  if (!isAdmin || syncing || restoringPosition) return;
  socket.emit("video-control", { action: "pause", currentTime: video.currentTime, at: Date.now() });
});
video.addEventListener("seeked", () => {
  if (!isAdmin || syncing || restoringPosition) return;
  socket.emit("video-control", { action: "seek", currentTime: video.currentTime, at: Date.now() });
});
video.addEventListener("timeupdate", () => {
  if (!restoringPosition && hasVideo) {
    lastKnownTime = video.currentTime;
  }
});

function attachTurkishSubtitle(animeId, ep, mode, season, anime) {
  if (!animeId) return;
const offsetKey = `${animeId}_${ep}_${mode}`;
subtitleOffset = subtitleOffsetStore.get(offsetKey);
const offsetLabel = document.getElementById("subOffsetLabel");
if (offsetLabel) offsetLabel.textContent = (subtitleOffset > 0 ? "+" : "") + subtitleOffset + "s";
  video.querySelectorAll("track").forEach((t) => t.remove());
  trTrack = null;

  const title = encodeURIComponent(anime.titleEnglish || anime.title || "");
  const romaji = encodeURIComponent(anime.titleRomaji || "");
  const titleForOs = title || romaji;

  const url = `/api/subtitle?id=${animeId}&ep=${ep}&mode=${mode}&season=${season}&lang=tr&title=${titleForOs}&offset=${subtitleOffset}&t=${Date.now()}`;
  log("Türkçe altyazı yükleniyor...");

  const track = document.createElement("track");
  track.kind = "subtitles";
  track.label = "Türkçe";
  track.srclang = "tr";
  track.src = url;
  track.default = true;
  video.appendChild(track);

  const forceShow = () => {
    const tracks = video.textTracks;
    let found = false;
    for (let i = 0; i < tracks.length; i++) {
      if (tracks[i].language === "tr" || tracks[i].label === "Türkçe") {
        tracks[i].mode = "showing";
        trTrack = tracks[i];
        found = true;
      } else {
        tracks[i].mode = "disabled";
      }
    }
    if (found) {
      log("Türkçe altyazı aktif");
      setSubStatus("ok", "Altyazı: Türkçe");
    }
  };

  setTimeout(forceShow, 400);
  setTimeout(forceShow, 1200);
  setTimeout(forceShow, 2500);
  setTimeout(forceShow, 5000);

  track.addEventListener("load", () => {
    log("Türkçe altyazı yüklendi");
    forceShow();
  });

  track.addEventListener("error", () => {
    log("Altyazı yükleme hatası");
    setSubStatus("none", "Altyazı bulunamadı");
  });
}

async function startSubtitleFlow(animeId, episode, mode, season, anime) {
  setSubStatus("loading", "Altyazı hazırlanıyor...");
  log("Altyazı hazırlanıyor...");

  let elapsed = 0;
  if (subtitlePollInterval) clearInterval(subtitlePollInterval);
  subtitlePollInterval = setInterval(async () => {
    elapsed += 2;
    try {
      const r = await fetch(`/api/subtitle-status?id=${animeId}&ep=${episode}&mode=${mode}`);
      const d = await r.json();
      if (d.ready) {
        clearInterval(subtitlePollInterval);
        subtitlePollInterval = null;
        setSubStatus("loading", "Altyazı yükleniyor...");
        attachTurkishSubtitle(animeId, episode, mode, season, anime);
      } else if (elapsed > 60) {
        clearInterval(subtitlePollInterval);
        subtitlePollInterval = null;
        attachTurkishSubtitle(animeId, episode, mode, season, anime);
      }
    } catch (e) {}
  }, 2000);
}
function shiftSubtitle(seconds) {
  if (!currentAnime) return;
  const ep = parseInt(epInput.value) || 1;
  const mode = modeSelect.value || "sub";
  const key = `${currentAnime.id}_${ep}_${mode}`;

  subtitleOffset = Math.round((subtitleOffset + seconds) * 10) / 10;
  if (subtitleOffset > 30) subtitleOffset = 30;
  if (subtitleOffset < -30) subtitleOffset = -30;

  subtitleOffsetStore.set(key, subtitleOffset);

  const offsetLabel = document.getElementById("subOffsetLabel");
  if (offsetLabel) offsetLabel.textContent = (subtitleOffset > 0 ? "+" : "") + subtitleOffset + "s";

  log(`Altyazı kaydırma: ${subtitleOffset > 0 ? "+" : ""}${subtitleOffset}s`);

  // Altyazıyı yeniden yükle (yeni offset ile)
  if (hasVideo && currentAnime) {
    attachTurkishSubtitle(currentAnime.id, ep, mode, parseInt(seasonInput.value) || 1, currentAnime);
  }
}
function resetSubtitleState() {
  if (subtitlePollInterval) {
    clearInterval(subtitlePollInterval);
    subtitlePollInterval = null;
  }
  setSubStatus("none", "Altyazı yok");
}

async function doSearch() {
  const q = document.getElementById("searchInput").value.trim();
  if (q.length < 2) return;
  const btn = document.getElementById("searchBtn");
  btn.disabled = true;
  btn.textContent = "...";
  resultsBox.innerHTML = '<div style="padding:12px;color:#888;font-size:12px">Aranıyor...</div>';
  log("Ara: " + q);
  try {
    const r = await fetch("/api/search?q=" + encodeURIComponent(q));
    const d = await r.json();
    if (!d.results || d.results.length === 0) {
      resultsBox.innerHTML = '<div style="padding:12px;color:#888;font-size:12px">Sonuç yok</div>';
      return;
    }
    resultsBox.innerHTML = "";
    d.results.forEach((x) => {
      const c = document.createElement("div");
      c.className = "result";
      c.innerHTML = `<img src="${x.poster}" onerror="this.style.opacity=0.3"><div class="result-title">${escapeHtml(x.title)}</div><div class="result-meta">${x.year} • ${x.episodes}b</div>`;
      c.onclick = () => selectAnime(x, c);
      resultsBox.appendChild(c);
    });
    log(`${d.results.length} sonuç bulundu`);
  } catch (e) {
    log("Arama hatası: " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Ara";
  }
}

function selectAnime(anime, el) {
  if (isLoading) return;
  document.querySelectorAll(".result").forEach((x) => x.classList.remove("selected"));
  el.classList.add("selected");
  currentAnime = anime;
  selectedName.textContent = anime.title;
  epInput.max = anime.episodes || 9999;
  epInput.value = 1;
  seasonInput.value = 1;
  log("Seçildi: " + anime.title);
  loadCurrentEpisode();
}

function onEpChange() {
  if (!currentAnime || isLoading) return;
  loadCurrentEpisode();
}

function onModeChange() {
  if (!currentAnime || isLoading) return;
  loadCurrentEpisode();
}

async function loadCurrentEpisode() {
  if (!currentAnime) return;
  if (isLoading) return;
  isLoading = true;

  document.querySelectorAll(".result").forEach((x) => x.classList.add("disabled"));

  const ep = parseInt(epInput.value) || 1;
  const season = parseInt(seasonInput.value) || 1;
  const mode = modeSelect.value || "sub";

  setOverlay("Video kaynağı alınıyor...<br><span style='font-size:11px;color:#888'>10-20 saniye sürebilir</span>");
  resetSubtitleState();
  log(`Bölüm ${ep} (${mode}, S${season}) yükleniyor...`);

  try {
    const title = encodeURIComponent(currentAnime.titleEnglish || currentAnime.title || "");
    const r = await fetch(`/api/stream?id=${currentAnime.id}&ep=${ep}&mode=${mode}&season=${season}&title=${title}`);
    const d = await r.json();

    if (d.error) {
      log("Hata: " + d.error);
      setOverlay("❌ " + d.error, false);
      toast("Hata: " + d.error);
      return;
    }

    log("Video hazır" + (d.cached ? " (önbellek)" : ""));
    hasVideo = true;
    hideOverlay();
    liveBadge.style.display = "flex";

    const videoTitle = `${currentAnime.title} — Bölüm ${ep}`;
    loadVideoSource(d.url);
    statusText.textContent = videoTitle;

    socket.emit("video-load", {
      url: d.url,
      title: videoTitle,
      animeId: currentAnime.id,
      episode: ep,
      season: season,
      mode: mode,
      hasSubtitles: true
    });

    startSubtitleFlow(currentAnime.id, ep, mode, season, currentAnime);

    log("Yayınlandı: " + videoTitle);
  } catch (e) {
    log("Hata: " + e.message);
    setOverlay("❌ " + e.message, false);
  } finally {
    isLoading = false;
    document.querySelectorAll(".result").forEach((x) => x.classList.remove("disabled"));
  }
}

document.getElementById("searchInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") doSearch();
});

function escapeHtml(t) {
  const d = document.createElement("div");
  d.textContent = t;
  return d.innerHTML;
}

setInterval(() => {
  if (video && !isAdmin) {
    if (video.hasAttribute("controls")) video.removeAttribute("controls");
  } else if (video && isAdmin) {
    if (!video.hasAttribute("controls")) video.setAttribute("controls", "");
  }
}, 500);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && socket && socket.connected) {
    socket.emit("request-sync");
    if (lastKnownTime > 2 && Math.abs(video.currentTime - lastKnownTime) > 3) {
      restoringPosition = true;
      video.currentTime = lastKnownTime;
      setTimeout(() => { restoringPosition = false; }, 800);
    }
  }
});

log("Uygulama başladı");
connectSocket();
</script>
