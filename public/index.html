<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime İzle - Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }

        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 24px;
            text-align: center;
        }

        /* Arama kutusu */
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 14px 18px;
            font-size: 16px;
            border: 2px solid #333;
            border-radius: 12px;
            background: #1a1a2e;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: #667eea; }
        .search-box button {
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            background: #667eea;
            border: none;
            border-radius: 12px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-box button:hover { background: #5568d3; }
        .search-box button:disabled { background: #333; cursor: not-allowed; }

        /* Sonuç grid */
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .anime-card {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }
        .anime-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            border-color: #667eea;
        }
        .anime-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            background: #333;
        }
        .anime-info { padding: 10px; }
        .anime-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .anime-meta {
            font-size: 11px;
            color: #888;
        }

        /* Player alanı */
        .player-section {
            display: none;
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .player-section.active { display: block; }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .player-title { font-size: 18px; font-weight: 600; }
        .player-close {
            background: #e74c3c;
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        /* Kontroller */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .controls label {
            font-size: 13px;
            color: #aaa;
        }
        .controls select, .controls input {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0f0f1a;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .controls select:focus, .controls input:focus { border-color: #667eea; }

        /* Video iframe */
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }
        .error {
            padding: 12px;
            background: rgba(231, 76, 60, 0.15);
            border-left: 4px solid #e74c3c;
            border-radius: 8px;
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
        }
        .error.active { display: block; }

        /* Bölüm seçici */
        .episode-picker {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: #0f0f1a;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .ep-btn {
            padding: 10px 0;
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .ep-btn:hover { background: #444; }
        .ep-btn.active {
            background: #667eea;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Anime İzle</h1>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Anime ara... (ör: rezero, naruto, jujutsu)" autocomplete="off">
            <button id="searchBtn" onclick="doSearch()">Ara</button>
        </div>

        <div class="error" id="errorBox"></div>

        <div class="results" id="results"></div>

        <div class="player-section" id="playerSection">
            <div class="player-header">
                <div class="player-title" id="playerTitle">Anime</div>
                <button class="player-close" onclick="closePlayer()">✕ Kapat</button>
            </div>

            <div class="controls">
                <label>Sunucu:</label>
                <select id="serverSelect" onchange="reloadStream()">
                    <option value="hd1">HD-1</option>
                    <option value="hd2">HD-2</option>
                    <option value="hd3">HD-3</option>
                    <option value="hd4">HD-4</option>
                    <option value="hd5">HD-5</option>
                    <option value="hd6">HD-6</option>
                </select>

                <label>Mod:</label>
                <select id="modeSelect" onchange="reloadStream()">
                    <option value="sub">Altyazılı</option>
                    <option value="dub">Dublaj</option>
                </select>

                <label>Bölüm:</label>
                <input type="number" id="epInput" min="1" value="1" style="width: 80px;" onchange="reloadStream()">
            </div>

            <div class="episode-picker" id="episodePicker"></div>

            <div class="video-wrapper">
                <iframe id="videoFrame" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
            </div>
        </div>
    </div>

    <script>
        let currentAnime = null;
        let searchTimeout = null;

        // Enter ile ara
        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        // Canlı arama (debounce)
        document.getElementById('searchInput').addEventListener('input', (e) => {
            if (searchTimeout) clearTimeout(searchTimeout);
            const q = e.target.value.trim();
            if (q.length < 2) return;
            searchTimeout = setTimeout(() => doSearch(), 600);
        });

        async function doSearch() {
            const q = document.getElementById('searchInput').value.trim();
            if (!q || q.length < 2) {
                showError('En az 2 karakter yaz');
                return;
            }

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = '...';
            document.getElementById('results').innerHTML = '<div class="loading">🔍 Aranıyor...</div>';
            hideError();

            try {
                const res = await fetch(`/api/anime/search?q=${encodeURIComponent(q)}`);
                const data = await res.json();

                if (!data.results || data.results.length === 0) {
                    document.getElementById('results').innerHTML = '<div class="loading">Sonuç bulunamadı</div>';
                    return;
                }

                renderResults(data.results);
            } catch (e) {
                showError('Arama hatası: ' + e.message);
                document.getElementById('results').innerHTML = '';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Ara';
            }
        }

        function renderResults(results) {
            const container = document.getElementById('results');
            container.innerHTML = '';

            results.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.innerHTML = `
                    <img src="${anime.poster}" alt="${anime.title}" onerror="this.style.display='none'">
                    <div class="anime-info">
                        <div class="anime-title">${escapeHtml(anime.title)}</div>
                        <div class="anime-meta">${anime.format} • ${anime.year || '?'} • ${anime.episodes} bölüm</div>
                    </div>
                `;
                card.onclick = () => selectAnime(anime);
                container.appendChild(card);
            });
        }

        function selectAnime(anime) {
            currentAnime = anime;
            document.getElementById('playerSection').classList.add('active');
            document.getElementById('playerTitle').textContent = anime.title;

            // Bölüm seçici doldur
            const picker = document.getElementById('episodePicker');
            picker.innerHTML = '';

            const totalEps = anime.episodes || 1;
            for (let i = 1; i <= totalEps; i++) {
                const btn = document.createElement('button');
                btn.className = 'ep-btn';
                btn.textContent = i;
                btn.onclick = () => selectEpisode(i);
                picker.appendChild(btn);
            }

            // İlk bölümü seç
            selectEpisode(1);

            // Ekrana kaydır
            document.getElementById('playerSection').scrollIntoView({ behavior: 'smooth' });
        }

        function selectEpisode(ep) {
            document.getElementById('epInput').value = ep;

            // Buton stillerini güncelle
            document.querySelectorAll('.ep-btn').forEach((btn, i) => {
                btn.classList.toggle('active', (i + 1) === ep);
            });

            reloadStream();
        }

        async function reloadStream() {
            if (!currentAnime) return;

            const ep = parseInt(document.getElementById('epInput').value) || 1;
            const server = document.getElementById('serverSelect').value;
            const mode = document.getElementById('modeSelect').value;

            const iframe = document.getElementById('videoFrame');
            iframe.src = 'about:blank';

            hideError();

            try {
                const res = await fetch(`/api/anime/stream?id=${currentAnime.id}&ep=${ep}&server=${server}&mode=${mode}`);
                const data = await res.json();

                if (data.error) {
                    showError('Video yüklenemedi: ' + data.error);
                    return;
                }

                if (data.url) {
                    iframe.src = data.url;
                    console.log(`✅ ${data.server} → ${data.url}`);
                }
            } catch (e) {
                showError('Bağlantı hatası: ' + e.message);
            }
        }

        function closePlayer() {
            document.getElementById('playerSection').classList.remove('active');
            document.getElementById('videoFrame').src = 'about:blank';
            currentAnime = null;
        }

        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.textContent = msg;
            box.classList.add('active');
        }

        function hideError() {
            document.getElementById('errorBox').classList.remove('active');
        }

        function escapeHtml(t) {
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }
    </script>
</body>
</html>
